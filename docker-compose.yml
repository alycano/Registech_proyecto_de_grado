version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend-1
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend-1
    ports:
      - "5173:5173"
    restart: always