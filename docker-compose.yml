version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: proyecto_final
      MYSQL_ROOT_PASSWORD: tu_password_root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: backend-1
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - DB_HOST=db
      - USER=root
      - DB_PASSWORD=tu_password_root
      - DB_NAME=proyecto_final
      - WT_SECRET=cesarcar7719772647*
    depends_on:
      - db
    restart: always

volumes:
  db_data: